name: Actualizar README

# DESACTIVADO: GitHub Actions está bloqueado en esta cuenta por facturación.
# Por eso solo queda el disparador manual: así no se ejecuta solo ni falla.
# La actualización real la hace scripts/actualizar.ps1 desde la PC.
#
# Si algún día Actions vuelve a estar disponible, descomenta el bloque
# "schedule" de abajo y esto se encarga solo, sin depender de tu PC.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * *"   # todos los días a las 00:00 en Honduras

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerar bloques del README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Actualizar estadísticas del README"
            git push
          fi
