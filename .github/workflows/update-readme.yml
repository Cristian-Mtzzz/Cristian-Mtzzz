name: Actualizar README

on:
  schedule:
    # Todos los días a las 06:00 UTC (00:00 en Honduras)
    - cron: "0 6 * * *"
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:
  # Al tocar el script o el propio workflow
  push:
    branches: [main]
    paths:
      - "scripts/update-readme.mjs"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerar bloques del README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Actualizar estadísticas del README"
            git push
          fi
